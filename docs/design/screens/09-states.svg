<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#17201f" flood-opacity="0.08"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="sweep" cx="0" cy="0" r="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.05"/></radialGradient><linearGradient id="spot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2f3f1"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><rect width="1280" height="520" fill="#f6f8fa"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#17233b" text-anchor="start" >Every data panel has four states</text><text x="40" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6577" text-anchor="start" >Loading, empty, error and content. Errors say what happened in plain words and offer the next step.</text><text x="40" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6577" text-anchor="start" letter-spacing="0.6">LOADING</text><rect x="40" y="124" width="290" height="180" rx="10" fill="#ffffff" stroke="#e1e6ec" stroke-width="1" filter="url(#sh)"/><circle cx="80" cy="184" r="9" fill="none" stroke="#0d8a83" stroke-width="3" stroke-dasharray="40 20"/><text x="98" y="189" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6577" text-anchor="start" >Finding nearby workers…</text><text x="342" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6577" text-anchor="start" letter-spacing="0.6">EMPTY</text><rect x="342" y="124" width="290" height="180" rx="10" fill="#ffffff" stroke="#e1e6ec" stroke-width="1" filter="url(#sh)"/><text x="366" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#17233b" text-anchor="start" >No available workers within 5 km</text><text x="366" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="start" >Locations older than 2 hours are removed</text><text x="366" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="start" >automatically. Press “Add fresh pings”.</text><text x="644" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6577" text-anchor="start" letter-spacing="0.6">SERVICE DOWN</text><rect x="644" y="124" width="290" height="180" rx="10" fill="#ffffff" stroke="#e1e6ec" stroke-width="1" filter="url(#sh)"/><text x="668" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start" >Could not load this</text><text x="668" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#17233b" text-anchor="start" >The service is temporarily unavailable.</text><text x="668" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#17233b" text-anchor="start" >Please try again.</text><rect x="668" y="242" width="87.52000000000001" height="30" rx="6" fill="#ffffff" stroke="#c8d0da" stroke-width="1" /><text x="711.76" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#17233b" text-anchor="middle" >Try again</text><text x="946" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6577" text-anchor="start" letter-spacing="0.6">BAD LINK</text><rect x="946" y="124" width="290" height="180" rx="10" fill="#ffffff" stroke="#e1e6ec" stroke-width="1" filter="url(#sh)"/><text x="970" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start" >We couldn’t find that location</text><text x="970" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#17233b" text-anchor="start" >That job site does not exist. Pick one</text><text x="970" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#17233b" text-anchor="start" >from the list or click the map.</text><rect x="970" y="242" width="211.28000000000003" height="30" rx="6" fill="#0d8a83" /><text x="1075.64" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >Go to the default job site</text><rect x="40" y="330" width="1200" height="160" rx="10" fill="#fdf3e2" stroke="#f2d3a6" stroke-width="1" /><text x="64" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" >Not enough money in escrow</text><text x="64" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#17233b" text-anchor="start" >Not enough money in escrow to fund this gig. Nothing was charged.</text><text x="64" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start" >Balance</text><text x="64" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="650" fill="#17233b" text-anchor="start" >₹500.00</text><text x="244" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start" >Needed</text><text x="244" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="650" fill="#17233b" text-anchor="start" >₹4,500.00</text><text x="424" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start" >Short by</text><text x="424" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="650" fill="#b91c1c" text-anchor="start" >₹4,000.00</text><rect x="620" y="420" width="155.44" height="36" rx="6" fill="#ffffff" stroke="#c8d0da" stroke-width="1" /><text x="697.72" y="443.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#17233b" text-anchor="middle" >Top up ₹4,000.00</text><text x="820" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#b45309" text-anchor="start" >Errors explain, then offer the fix.</text></svg>